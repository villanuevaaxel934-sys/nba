name: Actualizar Estadísticas NBA

on:
  schedule:
    # Todos los días a las 12:00 UTC (6:00 AM hora del centro de México)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Actualizar estadísticas desde ESPN
        run: python scripts/actualizar_nba.py

      - name: Guardar cambios si hubo partidos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/equipos.json data/partidos_cache.json
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos."
          else
            git commit -m "Actualizar estadisticas NBA diarias"
            git push
          fi
